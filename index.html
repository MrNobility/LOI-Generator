<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LOI Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>LOI Generator</h2>

  <label>Offer Type</label>
  <select id="offerType">
    <option value="sellerFinance">Seller Finance</option>
    <option value="cash">Cash</option>
  </select>

  <label>Tone Style</label>
  <select id="toneStyle"></select>

  <label>Agent Name</label>
  <input type="text" id="agentName">

  <label>Property Address</label>
  <input type="text" id="propertyAddress">

  <label>Purchase Price ($)</label>
  <input type="number" id="purchasePrice">

  <label>Listed Price ($)</label>
  <input type="number" id="listedPrice">

  
  <label>Down Payment ($)</label>
  <input type="number" id="downPayment">

  <label>Monthly Payment (PITI) ($)</label>
  <input type="number" id="monthlyPayment">

  <label>Interest Rate (%)</label>
  <input type="number" id="interestRate" step="0.01">

  <label>Balloon Term (years)</label>
  <input type="number" id="balloonTerm">

  <label>Amortization (years)</label>
  <input type="number" id="amortization" value="30">

  <label>Monthly Insurance ($)</label>
  <input type="number" id="insurance">

  <label>Monthly Property Taxes ($)</label>
  <input type="number" id="taxes">

  <label>Close of Escrow</label>
  <input type="text" id="closeEscrow">

  <label>Earnest Money Deposit (EMD)</label>
  <input type="number" id="emd">

  <label>Your Name</label>
  <input type="text" id="yourName" value="Dalton Eddleman">

  <label>Your Phone</label>
  <input type="text" id="yourPhone" value="512-265-5448">

  <label>Your Email</label>
  <input type="text" id="yourEmail" value="Mr.Nobility@nobility.network">

  <label>Paste Deal Row (TSV)</label>
  <textarea id="tsvInput" rows="4"></textarea>
  <button id="parseBtn">Fill Form from TSV</button>
  <button id="generateBtn">Generate LOI</button>

  <div id="bulk-loi-section" style="border:1px solid #ccc; padding:16px; margin-top:20px;">
  <h2>📦 Bulk LOI Generator</h2>

  <label for="tsvInput"><strong>Paste TSV Data:</strong></label><br>
  <textarea id="tsvInput" rows="8" style="width:100%; margin-bottom:10px;"></textarea>

  <div style="margin-bottom:10px;">
    <label><strong>Default Offer Type:</strong></label>
    <select id="globalOfferType">
      <option value="Seller Finance">Seller Finance</option>
      <option value="Cash">Cash</option>
    </select>

    <label style="margin-left:20px;"><strong>Default Tone:</strong></label>
    <select id="globalToneStyle">
      <option value="professional">Professional</option>
      <option value="marketReality">Market Reality</option>
      <option value="friendly">Friendly</option>
    </select>
  </div>

  <button onclick="BulkLOI.handleBulkGenerate()" style="padding:10px 20px;">🚀 Generate Bulk LOIs</button>

  <div id="bulk-loi-output" style="margin-top:20px;"></div>
</div>

  <div id="output" style="margin-top:30px;"></div>
  <button id="copyBtn" style="display:none;">Copy to Clipboard</button>
  <div id="copyMessage" style="color:green; font-weight:bold; display:none;">Copied to clipboard ✅</div>

  <script src="bulkModule/tsvParser.js"></script>
  <script src="bulkModule/bulkGenerator.js"></script>
  <script src="bulkModule/handleBulkUI.js"></script>
  <!-- ✅ Script loaded LAST to avoid DOM issues -->
  <script src="script.js"></script>
</body>
</html>
